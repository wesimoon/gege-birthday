<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151710">
<title>Dear Gege, Tonight Is Yours</title>
<link rel="stylesheet" href="/scene.css">
<link rel="stylesheet" href="/garden.css?v=stable-media3">
<link rel="stylesheet" href="/chapter.css?v=stable-media3">
<link rel="stylesheet" href="/ritual.css?v=gift3">
<link rel="stylesheet" href="/ending.css?v=final">
<script src="/ending-content.js?v=final" defer></script>
<script src="/ending.js?v=stable-media3" defer></script>
<script src="/audio.js?v=stable-media3" defer></script>
<script src="/chapter.js?v=audio1" defer></script>
<script src="/scene.js?v=stable-media3" defer></script>
</head>
<body>
<main id="film" aria-label="Dear Gege, Tonight Is Yours · 百合花房" data-phase="loading">
  <div id="lens">
    <div id="room">
      <img id="greenhouse" fetchpriority="high" src="/assets/opening-greenhouse.webp" alt="">
    </div>
    <div id="invitation">
      <div class="hand-frame">
        <img fetchpriority="high" src="/assets/opening-yoongi-invitation.webp" alt="">
        <button id="hand" hidden><span class="hand-mark" aria-hidden="true"></span><span class="hand-label">轻触他的手</span></button>
      </div>
    </div>
    <div class="haze"></div>
    <div class="friend left" id="baekhyun">
      <img fetchpriority="high" src="/assets/opening-baekhyun-matte.webp" alt="">
    </div>
    <div class="friend right" id="yeonjun">
      <img fetchpriority="high" src="/assets/opening-yeonjun-matte.webp" alt="">
    </div>
    <div id="near"><i></i><i></i></div>
    <div id="dust"></div>
  </div>
  <div class="grade" aria-hidden="true"></div>
  <div class="lid top" aria-hidden="true"></div><div class="lid bottom" aria-hidden="true"></div>
  <div id="garden-passage" aria-hidden="true" hidden><i></i><i></i><i></i></div>
  <section id="garden" aria-label="只为格格准备的生日花园" tabindex="-1" hidden inert>
    <div class="garden-world">
      <img width="1122" height="1402" fetchpriority="high" id="garden-plate" src="/assets/birthday-garden.webp" alt="阳光下的玻璃花房，木桌上放着粉白百合、奶油蛋糕、塔罗和一张折叠邀请卡。">
      <button id="lilies" class="garden-spot" aria-label="查看百合花束" aria-controls="lily-tag" aria-expanded="false"><span>百合花束</span></button>
      <button id="lily-tag" aria-label="打开花束里的小卡" aria-haspopup="dialog" hidden><span aria-hidden="true">윤기</span></button>
      <svg id="cake-fork" aria-hidden="true" viewBox="0 0 105 30">
        <defs><linearGradient id="silver" x2="0" y2="1"><stop stop-color="#645844"/><stop offset=".42" stop-color="#f9e5b8"/><stop offset=".64" stop-color="#c1a77f"/><stop offset="1" stop-color="#756249"/></linearGradient></defs>
        <path fill="url(#silver)" stroke="#5e4b33" stroke-width=".65" d="M98 11Q105 15 98 19L41 17Q36 17 30 22Q23 26 6 24L1 22L23 20V18L2 19V16L23 16V14L2 14V11L23 12V10L2 8L7 6Q25 5 31 9Q37 14 42 13Z"/>
      </svg>
      <img fetchpriority="high" id="tarot-patch" src="/assets/tarot-patch-fit.webp" alt="">
      <button id="tarot" class="garden-spot" aria-label="看塔罗与水晶" aria-haspopup="dialog"><span>塔罗与水晶</span></button>
      <button id="opened-gift" aria-label="看看拆开的礼物盒" hidden><img loading="lazy" src="/assets/gift-table-open.webp" alt=""></button>
      <div id="desk-prints" aria-hidden="true"></div>
      <button id="cake" class="garden-spot" aria-label="碰一碰生日蛋糕"><span>生日蛋糕</span></button>
      <button id="photo-first" class="garden-spot photo-spot" aria-label="拿起百合拍立得" aria-haspopup="dialog"><span>百合拍立得</span></button>
      <button id="photo-second" class="garden-spot photo-spot" aria-label="拿起花房拍立得" aria-haspopup="dialog"><span>花房拍立得</span></button>
      <button id="table-invite" class="garden-spot" aria-label="翻开桌上的邀请卡" aria-haspopup="dialog"><span>桌上的邀请卡</span></button>
      <div id="petals" aria-hidden="true"></div>
    </div>
    <p id="garden-hint">这里的东西，都可以碰一碰</p>
  </section>
  <dialog id="garden-card" aria-labelledby="card-title">
    <button id="close-card" aria-label="合上卡片">×</button>
    <article class="paper">
      <svg class="pressing" aria-hidden="true" viewBox="0 0 80 100"><path d="M26 94Q42 53 48 30M33 78Q21 64 12 63Q16 79 33 81M39 66Q58 65 68 52Q50 53 39 64M48 31C16 27 21 9 34 16L48 31C35 11 42 0 49 5Q57 10 48 31C63 5 80 14 68 25Q60 34 48 31C68 37 67 48 57 42Z"/></svg>
      <h2 id="card-title"></h2>
      <div id="card-copy"></div>
      <p id="card-signature"></p>
      <button id="birthday-link" class="paper-link" hidden>还有一封给你的生日信</button>
    </article>
    <div id="photo-view" hidden>
      <h2 id="photo-title" class="sr-only">拍立得</h2>
      <button id="flip-photo" aria-label="翻到拍立得背面" aria-pressed="false">
        <span class="print-turn">
          <span class="print-front"><img loading="lazy" id="print-image" alt=""><span id="print-caption"></span></span>
          <span class="print-back" aria-hidden="true"><span id="print-note"></span><span lang="ko">윤기</span></span>
        </span>
      </button>
      <p id="print-instruction" aria-hidden="true">轻触翻面</p>
    </div>
    <section id="chapter" hidden aria-labelledby="chapter-title">
      <h2 id="chapter-title" class="sr-only"></h2>
      <div id="tarot-view" hidden>
        <img loading="lazy" class="tarot-texture" src="/assets/tarot-cloth.webp" alt="">
        <div id="tarot-deck"></div>
        <div id="crystals"></div>
        <div id="tarot-reading" aria-live="polite"></div>
      </div>
      <div id="cake-view" hidden>
        <div class="cake-shot">
          <img loading="lazy" src="/assets/cake-close.webp" alt="三根蜡烛与粉色奶油裱花的生日蛋糕近景">
          <div id="close-flames" hidden aria-hidden="true"><i></i><i></i><i></i></div>
          <div id="cake-smoke" hidden aria-hidden="true"><i></i><i></i><i></i></div>
          <div id="wick-controls" hidden>
            <button aria-label="点亮左侧蜡烛"></button>
            <button aria-label="点亮中间蜡烛"></button>
            <button aria-label="点亮右侧蜡烛"></button>
          </div>
          <span id="cake-count" role="status" hidden></span>
          <button id="cake-touch" aria-label="轻轻碰一下蛋糕" hidden></button>
        </div>
        <div class="ritual-caption">
          <p id="cake-line" aria-live="polite"></p>
          <button id="blow-close" hidden>许好愿，就轻轻碰一下蛋糕。</button>
          <button id="skip-ritual" hidden>跳过动画</button>
        </div>
      </div>
      <div id="gift-view" hidden>
        <div class="gift-shot">
          <div class="gift-frame">
          <img loading="lazy" src="/assets/gift-stage-closed.webp" alt="花房木桌上的粉色缎带礼物盒">
          <img loading="lazy" class="gift-open-plate" src="/assets/gift-stage-open.webp" alt="">
          <div class="gift-glow" aria-hidden="true"></div>
          <button id="gift-touch" aria-label="拆开礼盒" hidden></button>
          </div>
        </div>
        <div class="ritual-caption">
          <p id="gift-line" aria-live="polite"></p>
          <button id="gift-open" hidden>拆开看看？</button>
        </div>
      </div>
      <div id="finale-view" hidden>
        <div class="ring-table">
          <img loading="lazy" src="/assets/finale-linen.webp" alt="百合与纱帘旁，亚麻桌面上同时放着拉环、银色素圈、粉色宝石戒指和主戒指">
          <div id="finale-choices"></div>
        </div>
        <div class="finale-footer">
        <div id="finale-response" aria-live="polite"></div>
        <button id="finale-skip" hidden>略过</button>
        <button id="accept-ring" hidden>把手给他</button>
        </div>
      </div>
      <div id="keepsake-view" hidden>
        <img loading="lazy" src="/assets/gege-keepsake-crop.png" alt="格格本人的手，裸粉美甲与无名指上的主戒指">
        <div class="keepsake-actions">
          <a href="assets/gege-keepsake-crop.png" download="11.11-For-Gege.png">保存纪念图</a>
          <button id="blessing" type="button">下一封祝福</button>
        </div>
      </div>
    </section>
  </dialog>
  <button id="ending-return" hidden>重翻相册</button>
  <section id="ending" hidden aria-label="格格的私人相册">
    <div class="ending-scene" aria-hidden="true"></div>
    <button id="ending-close" aria-label="回到花房">×</button>
    <div id="album" tabindex="-1" aria-label="私人相册">
      <div class="book">
        <div id="album-page"></div>
        <button class="page-edge previous" id="album-prev" aria-label="翻到上一页" hidden>‹</button>
        <button class="page-edge next" id="album-next" aria-label="翻到下一页" hidden>›</button>
      </div>
    </div>
    <div id="letter-scene" hidden>
      <article class="friend-letter" aria-labelledby="friend-letter-title">
        <button id="letter-close" aria-label="合上生日信">×</button>
        <h2 id="friend-letter-title" tabindex="-1">To 格格</h2>
        <div id="birthday-letter" role="region" aria-label="生日信正文" tabindex="0"></div>
        <button id="letter-finish">合上信纸</button>
      </article>
    </div>
    <div id="dream-end" hidden tabindex="-1">
      <h2>Happy Birthday, 格格.</h2>
      <p>你的梦境，永远为你开放。</p>
      <div class="end-actions">
        <button id="end-garden">回到花房</button>
        <button id="end-album">重翻相册</button>
        <button id="end-replay">重新观看</button>
      </div>
    </div>
  </section>
  <header class="controls" hidden>
    <button id="replay">重新观看</button>
  </header>
  <button id="sound" aria-label="音效" aria-pressed="true" hidden>音效开</button>
  <section class="dialogue" aria-label="字幕">
    <button id="skip-cue" hidden>略过</button>
    <div id="caption" role="status" aria-live="polite"><span id="speaker"></span><p id="line"></p></div>
  </section>
  <p id="loading" role="status">正在等花房亮起来</p>
</main>
</body>
</html>
